# CI (KAN-18): every pull request and every push to development or main builds and tests the backend and the
# frontend, and checks the Terraform code (KAN-103). The job names are what branch protection requires; rename
# them together with the protection rule. deploy.yml (KAN-105) starts after this workflow by its name: rename both.
name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

# A newer push to a PR cancels its run still going; runs for merges into development/main always finish, so every
# integration commit gets a result
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit and integration tests; the integration tests start Postgres and S3Mock with Testcontainers on the
      # runner's Docker. JaCoCo writes the coverage report in the verify phase.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Test results summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          failed = []
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              suite = ET.parse(path).getroot()
              t += int(suite.get('tests')); f += int(suite.get('failures'))
              e += int(suite.get('errors')); s += int(suite.get('skipped'))
              for case in suite.iter('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      failed.append(f"{case.get('classname')}#{case.get('name')}")
          print(f"### Backend tests\n{t} run, {f} failures, {e} errors, {s} skipped\n")
          for name in failed:
              print(f"- {name}")
          EOF

      - name: Coverage summary
        if: success()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          missed = covered = 0
          with open('target/site/jacoco/jacoco.csv') as report:
              for row in csv.DictReader(report):
                  missed += int(row['LINE_MISSED']); covered += int(row['LINE_COVERED'])
          print(f"### Backend line coverage\n{100 * covered / (missed + covered):.1f}% ({covered} of {missed + covered} lines)")
          EOF

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 14

  java-style:
    name: Java style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # The mechanical rules of CLAUDE.md section 4 (imports instead of qualified names, file endings)
      - name: Check
        run: git ls-files 'backend/src/*.java' | xargs python3 .claude/scripts/java/java_style.py --check

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      # No credentials and no state: -backend=false skips the S3 backend; the providers come from the lock files
      - name: Validate
        run: |
          for dir in . bootstrap; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
          done

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Known errors are recorded in eslint-suppressions.json; a new error, or a recorded one that was fixed
      # without pruning the file, fails the step
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Checks that the production bundle compiles; the VITE_* settings are optional (src/config.js)
      - name: Build
        run: npm run build
