services:
  # 1. Головна база даних (для Auth, Music, Payment)
  postgres:
    image: postgres:15-alpine
    container_name: music_app_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_app_db

  # 2. MinIO (S3 сумісне сховище файлів)
  # Доступ до консолі: http://localhost:9001 (user/password)
  minio:
    image: minio/minio
    container_name: music_app_minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      - MINIO_ROOT_USER=minio_user
      - MINIO_ROOT_PASSWORD=minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: