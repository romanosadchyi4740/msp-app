# Shared settings. Environment-specific values live in the profiles:
#   local (default) - application-local.yaml, defaults match docker-compose.yml
#   prod            - application-prod.yaml, every value must come from the environment
spring:
  application:
    name: music-app

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jpa:
    open-in-view: true
    show-sql: false
    generate-ddl: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server.port: 8080

minio:
  presigned-url-expiry-seconds: 3600

jwt:
  expiration: ${JWT_EXPIRATION:86400000}

# TURN credentials handed out by GET /api/rtc/ice-servers stop working after this long (1 to 6 hours)
turn:
  credential-ttl-seconds: ${TURN_CREDENTIAL_TTL_SECONDS:3600}

# The plain WebSocket endpoint /ws-raw (no SockJS) is for Postman and test tooling; local and test turn it on
app:
  websocket:
    raw-endpoint-enabled: false

# Only /actuator/health is exposed, and it returns just {"status": ...} (public, for the ALB health check)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # No liveness/readiness groups: nothing uses them (Caddy, the Compose healthcheck and the deploy workflow call
      # /actuator/health), and the response would list their names (KAN-106)
      probes:
        enabled: false
