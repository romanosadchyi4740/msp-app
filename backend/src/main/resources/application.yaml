# Shared settings. Environment-specific values live in the profiles:
#   local (default) - application-local.yaml, defaults match docker-compose.yml
#   prod            - application-prod.yaml, every value must come from the environment
spring:
  application:
    name: music-app

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jpa:
    open-in-view: true
    show-sql: false
    generate-ddl: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server.port: 8080

minio:
  presigned-url-expiry-seconds: 3600

jwt:
  expiration: ${JWT_EXPIRATION:86400000}
