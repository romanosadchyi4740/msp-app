# Local development. Defaults match docker-compose.yml; any value can still be overridden by env vars.
spring:
  datasource:
    url: ${DB_DATASOURCE_URL:jdbc:postgresql://localhost:5432/music_app_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  # Address browsers use for presigned URLs; differs from url when the backend runs in Docker
  public-url: ${MINIO_PUBLIC_URL:${minio.url}}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_USER:minio_user}
  secret-key: ${MINIO_PASSWORD:minio_password}
  bucket-name: ${MINIO_BUCKET_NAME:music-files}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

encryption:
  secret-key: ${ENCRYPTION_SECRET:12345678901234567890123456789012}

# coturn from docker-compose (profile turn or full); the secret is its static-auth-secret
turn:
  secret: ${TURN_SECRET:local_turn_secret}
  urls: "${TURN_URLS:turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}"
  stun-urls: "${STUN_URLS:stun:localhost:3478}"

google:
  client:
    id: ${GOOGLE_CLIENT_ID:125635909882-acg0l3mbe76auvijfdru8oc1dbdbetjq.apps.googleusercontent.com}

app:
  cors:
    # Comma-separated list of allowed origins; 5174 is the dev server the end-to-end tests start (frontend/e2e)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Demo data (DemoDataSeeder); reference data such as genres is always seeded
data-seeder:
  enabled: ${DATA_SEEDER_ENABLED:true}
