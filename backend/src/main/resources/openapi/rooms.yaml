openapi: 3.0.3
info:
  title: SyncChord rooms API
  description: |
    Rooms for live lessons (KAN-34, UR-1, FR-5). Every endpoint needs a JWT. The creator of a room is its host; others
    join with the room's invite code. A room holds the host and up to 4 participants, and a closed room takes no new
    participants. A room is readable only by its participants; anyone else gets 404. Input is checked by the service,
    so schemas carry no validation constraints.

    A missing, invalid or expired token is rejected with 401 by the security filter, before any endpoint runs, so
    that response comes from Spring Security and has no ErrorResponse body.
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Rooms
  - name: Lessons
paths:
  /api/rooms:
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Create a room; the current user becomes its host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: The created room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/rooms/my:
    get:
      tags: [Rooms]
      operationId: getMyRooms
      summary: The rooms the current user takes part in, most recently joined first
      responses:
        '200':
          description: The rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomListItem'
  /api/rooms/invite/{code}:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    get:
      tags: [Rooms]
      operationId: getRoomPreview
      summary: What an invite leads to, shown before joining
      responses:
        '200':
          description: The room's preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPreview'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/rooms/join/{code}:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    post:
      tags: [Rooms]
      operationId: joinRoom
      summary: Join a room by its invite code; joining a room the user is already in changes nothing
      responses:
        '200':
          description: The joined room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The room is full or closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: A room with its participants
      responses:
        '200':
          description: The room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/rooms/{id}/invite:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Rooms]
      operationId: regenerateInvite
      summary: Replace the room's invite code, so the old link stops working; host only
      responses:
        '200':
          description: The room with its new invite code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '403':
          description: The user is a participant but not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The room is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rooms/{id}/close:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Rooms]
      operationId: closeRoom
      summary: Close the room and end its lesson; host only. Closing a closed room changes nothing
      responses:
        '200':
          description: The closed room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '403':
          $ref: '#/components/responses/NotHost'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/rooms/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Lessons]
      operationId: startLesson
      summary: Start a lesson with a tab; host only (KAN-35)
      description: |
        The tab must be the host's own or a public one. Playback starts stopped at the tab's tempo (120 BPM if the
        tab has none). Without Premium the lesson ends after 40 minutes, with a warning 5 minutes before; the events
        go to `/topic/rooms/{id}/state`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonTabRequest'
      responses:
        '201':
          description: The started lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/NotHost'
        '404':
          description: No such room, one the user does not take part in, or a tab the host may not read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The room is closed or already has an active lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rooms/{id}/sessions/current:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Lessons]
      operationId: getCurrentLesson
      summary: The room's active lesson
      responses:
        '200':
          description: The active lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '404':
          description: No such room, one the user does not take part in, or no active lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rooms/{id}/sessions/current/tab:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    put:
      tags: [Lessons]
      operationId: changeLessonTab
      summary: Put another tab on screen; playback starts over, stopped, at the new tab's tempo; host only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonTabRequest'
      responses:
        '200':
          description: The lesson with its new tab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/NotHost'
        '404':
          description: No such room, one the user does not take part in, no active lesson, or a tab the host may not read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rooms/{id}/sessions/current/end:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Lessons]
      operationId: endLesson
      summary: End the active lesson; host only
      responses:
        '200':
          description: The ended lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '403':
          $ref: '#/components/responses/NotHost'
        '404':
          description: No such room, one the user does not take part in, or no active lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoomId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteCode:
      name: code
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No such room, or one the user does not take part in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotHost:
      description: The user is a participant but not the host
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RoomStatus:
      type: string
      enum: [OPEN, CLOSED]
    RoomRole:
      type: string
      enum: [HOST, PARTICIPANT]
    RoomCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Required, at most 100 characters.
    RoomResponse:
      type: object
      required: [id, name, hostId, status, capacity, myRole, participants, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RoomStatus'
        capacity:
          type: integer
          description: The most participants the room holds, the host included.
        inviteCode:
          type: string
          description: Set only for the host.
        myRole:
          $ref: '#/components/schemas/RoomRole'
        participants:
          type: array
          description: In the order they joined, the host first.
          items:
            $ref: '#/components/schemas/ParticipantResponse'
        createdAt:
          type: string
          format: date-time
    ParticipantResponse:
      type: object
      required: [userId, role, joinedAt, online]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: '#/components/schemas/RoomRole'
        joinedAt:
          type: string
          format: date-time
        online:
          type: boolean
    RoomPreview:
      type: object
      required: [id, name, status, participantCount, capacity, full]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostName:
          type: string
        status:
          $ref: '#/components/schemas/RoomStatus'
        participantCount:
          type: integer
        capacity:
          type: integer
        full:
          type: boolean
    RoomListItem:
      type: object
      required: [id, name, hostId, status, myRole, participantCount, capacity, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostId:
          type: string
          format: uuid
        hostName:
          type: string
        status:
          $ref: '#/components/schemas/RoomStatus'
        myRole:
          $ref: '#/components/schemas/RoomRole'
        participantCount:
          type: integer
        capacity:
          type: integer
        createdAt:
          type: string
          format: date-time
    LessonTabRequest:
      type: object
      properties:
        tabId:
          type: string
          format: uuid
          description: Required; the host's own tab or a public one.
    LessonEndReason:
      type: string
      enum: [HOST_ENDED, LIMIT_REACHED, ROOM_CLOSED]
    LessonResponse:
      type: object
      required: [id, roomId, startedAt]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        tabId:
          type: string
          format: uuid
          description: Missing once the tab is deleted.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: Set once the lesson has ended.
        limitMinutes:
          type: integer
          description: The lesson's length limit; missing for no limit (Premium).
        endsAt:
          type: string
          format: date-time
          description: When the limit ends the lesson; missing for no limit.
        endReason:
          $ref: '#/components/schemas/LessonEndReason'
    ErrorResponse:
      type: object
      description: The error body of every endpoint, from GlobalExceptionHandler.
      properties:
        code:
          type: string
          example: 404 NOT_FOUND
        message:
          type: string
