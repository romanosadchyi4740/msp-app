#cloud-config
# Base setup of the demo instance (KAN-103). Runs once, on the first boot.
# The application stack (Compose file, .env, Caddy, coturn) is KAN-104.

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl

# 2 GB swap file: with 1 GB of RAM the kernel would otherwise kill the JVM or Postgres under memory pressure
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

write_files:
  # Use swap only when RAM is really short, so the JVM heap stays in memory
  - path: /etc/sysctl.d/90-syncchord.conf
    content: |
      vm.swappiness=10
  # Container logs are capped so they cannot fill the root volume
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

runcmd:
  - sysctl --system
  # Docker Engine and the compose plugin from Docker's apt repository (the Ubuntu package has no compose v2 plugin)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
  # apt-daily/unattended-upgrades often hold the dpkg lock right after the first boot; wait for it instead of failing
  - apt-get -o DPkg::Lock::Timeout=600 update
  - DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  # Home of the Compose file and the .env with the secrets (mode 600, written by the owner in KAN-104)
  - install -d -m 0750 -o root -g root /opt/syncchord
